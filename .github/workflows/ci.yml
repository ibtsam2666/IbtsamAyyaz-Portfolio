name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run UI and API suites (sharded)
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  report:
    name: Merge HTML report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge shard reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report
          retention-days: 14

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  demos:
    name: Demos (MCP server, AI agent replay, mutation testing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: MCP server answers over stdio
        run: npx tsx mcp-rerun-server/smoke-client.ts
      - name: AI test agent (recorded response)
        run: npx tsx ai-test-agent/agent.ts ai-test-agent/stories/cart-badge.md --replay
      - name: Mutation testing on the checkout spec
        run: npx tsx mutation-testing/mutate-assertions.ts ui-tests/tests/checkout.spec.ts

  pages:
    name: Publish site and latest report
    needs: report
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: html-report
          path: site/report
      - name: Assemble site
        run: |
          cp index.html site/index.html
          mkdir -p site/ai-test-agent site/mutation-testing site/media site/case-studies
          cp ai-test-agent/sample-run.txt site/ai-test-agent/sample-run.txt
          cp mutation-testing/sample-output.txt site/mutation-testing/sample-output.txt
          cp sample-failure-report.md site/sample-failure-report.md
          cp how-to-run.html site/how-to-run.html
          cp resume.pdf social-preview.png site/
          cp media/qa-agent-walkthrough.webm site/media/qa-agent-walkthrough.webm
          cp case-studies/cart-badge-agent.html site/case-studies/cart-badge-agent.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
